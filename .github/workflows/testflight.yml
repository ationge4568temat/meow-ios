name: TestFlight Auto-Deploy

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Private Config
        run: |
          echo "Replacing Bundle IDs and App Groups..."
          LC_ALL=C find . -type f -not -path "*/\.git/*" -not -path "*/\.github/*" -exec sed -i '' 's/com.tangzixiang.meow/com.david.fkad/g' {} +
          
          echo "Replacing App Name and VPN Display Name..."
          # project.yml 中 会改 meow 与 meow Tunnel
          sed -i '' 's/CFBundleDisplayName: meow/CFBundleDisplayName: FkAd/g' project.yml
          sed -i '' 's/mgr.localizedDescription = "meow"/mgr.localizedDescription = "FkAd"/g' App/Sources/Services/VpnManager.swift
          
          echo "Replacing App Icon..."
          mv .github/workflows/app_flat.png docs/appicon.png
          pip3 install --quiet Pillow --break-system-packages
          ./scripts/generate-app-icon.sh

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Set up Rust (stable + iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo registry, git, and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/meow-ios-ffi/target
          key: cargo-testflight-${{ runner.os }}-${{ hashFiles('core/rust/meow-ios-ffi/Cargo.lock') }}
          restore-keys: |
            cargo-testflight-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'MeowShared/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Setup App Store Connect API Key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Xcode looks for API keys in ~/.appstoreconnect/private_keys/
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          # Create ExportOptions.plist for TestFlight upload
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

      - name: Build Rust Core (Device Only)
        run: |
          .github/workflows/build-rust-device.sh

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Archive Project
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project meow-ios.xcodeproj \
            -scheme meow-ios \
            -configuration Release \
            -archivePath build/meow-ios.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID \
            DEVELOPMENT_TEAM=$TEAM_ID

      - name: Export and Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/meow-ios.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID
