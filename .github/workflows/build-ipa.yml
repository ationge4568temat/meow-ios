name: Build and Sign IPA

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ^26.0

      - name: Set up Rust (stable + iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo registry, git, and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/meow-ios-ffi/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/rust/meow-ios-ffi/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Tools
        run: |
          brew install xcodegen xcbeautify

      - name: Setup Provisioning Profile & Certificate
        env:
          P12_PATH: "证书/证书文件.p12"
          PP_PATH: "证书/描述文件.mobileprovision"
          PWD_PATH: "证书/密码.txt"
        run: |
          # Extract Team ID dynamically
          TEAM_ID=$(strings "$PP_PATH" | grep -A2 "<key>TeamIdentifier</key>" | grep string | sed 's/<[^>]*>//g' | tr -d '[:space:]')
          echo "Extracted Team ID: $TEAM_ID"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
          P12_PASSWORD=$(cat "$PWD_PATH")
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Create and unlock temporary keychain
          security create-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build MeowCore.xcframework
        run: scripts/build-rust.sh

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive Unsigned
        run: |
          set -o pipefail
          xcodegen generate
          
          xcodebuild archive \
            -project meow-ios.xcodeproj \
            -scheme meow-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/meow-ios.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Manual Package and Sign
        run: |
          set -e
          APP_PATH="build/meow-ios.xcarchive/Products/Applications/meow-ios.app"
          EXT_PATH="$APP_PATH/PlugIns/PacketTunnel.appex"
          
          # Find the certificate name from keychain
          CERT_NAME=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep -o '".*"' | head -n 1 | tr -d '"')
          echo "Found Certificate: $CERT_NAME"
          
          if [ -z "$CERT_NAME" ]; then
            echo "Error: No codesigning identity found in the provided p12 file!"
            exit 1
          fi

          # Extract entitlements from the mobileprovision
          security cms -D -i 证书/描述文件.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" profile.plist > entitlements.plist
          
          # Create a copy for the extension and append .PacketTunnel to the application-identifier
          cp entitlements.plist ext_entitlements.plist
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :application-identifier" entitlements.plist)
          /usr/libexec/PlistBuddy -c "Set :application-identifier ${APP_ID}.PacketTunnel" ext_entitlements.plist
          
          # 0. Sign embedded Frameworks
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "Signing embedded Frameworks..."
            find "$APP_PATH/Frameworks" -type d -name "*.framework" -exec codesign -f -s "$CERT_NAME" {} \;
            find "$APP_PATH/Frameworks" -type f -name "*.dylib" -exec codesign -f -s "$CERT_NAME" {} \;
          fi

          # 1. Sign the PacketTunnel Extension
          if [ -d "$EXT_PATH" ]; then
            echo "Signing PacketTunnel..."
            cp 证书/描述文件.mobileprovision "$EXT_PATH/embedded.mobileprovision"
            codesign -f -s "$CERT_NAME" --entitlements ext_entitlements.plist "$EXT_PATH"
          fi
          
          # 2. Sign the Main App
          echo "Signing Main App..."
          cp 证书/描述文件.mobileprovision "$APP_PATH/embedded.mobileprovision"
          codesign -f -s "$CERT_NAME" --entitlements entitlements.plist "$APP_PATH"
          
          # 3. Package into IPA
          mkdir -p build/output/Payload
          cp -r "$APP_PATH" build/output/Payload/
          cd build/output
          zip -qr meow-ios-signed.ipa Payload
          echo "Successfully created meow-ios-signed.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: meow-ios-ipa
          path: build/output/*.ipa
